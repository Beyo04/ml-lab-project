name: DevSecOps MLOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast-and-sca:
    name: Code & Dependency Security (SAST & SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Run Bandit (SAST)
        run: bandit -r . -x ./v1

      - name: Run Trivy (SCA & Secret Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  build-and-dast:
    name: Build Image & Dynamic Security (DAST)
    needs: sast-and-sca
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t ml-api:latest .

      - name: Run Docker Container
        run: |
          docker run -d --network="host" --name ml-api-container ml-api:latest
          sleep 5
          curl --fail http://localhost:8000/health || exit 1

      - name: Run OWASP ZAP Baseline Scan (DAST)
        run: |
          docker run --rm --network="host" -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:8000 -I || true